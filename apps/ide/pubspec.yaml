name: gubasic_ide
description: >-
  The GuBASIC IDE: opens a project and runs it in a run window, on the
  desktop and on the web (docs/DESIGN.md §2).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  gubasic_lang:
    path: ../../packages/gubasic_lang
  gubasic_runtime:
    path: ../../packages/gubasic_runtime
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Noto Sans KR 2.004 (OFL, fonts/OFL.txt), the IDE's font on every
  # platform (D30). The source is in README.md.
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: fonts/NotoSansKR-Regular.otf
        - asset: fonts/NotoSansKR-Bold.otf
          weight: 700
