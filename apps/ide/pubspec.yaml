name: gubasic_ide
description: >-
  The GuBASIC IDE: opens a project and runs it in a run window, on the
  desktop and on the web (docs/DESIGN.md §2).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  gubasic_lang:
    path: ../../packages/gubasic_lang
  gubasic_runtime:
    path: ../../packages/gubasic_runtime
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # D2Coding 1.3.2 Regular (OFL, fonts/d2coding/OFL.txt), the code
  # editor's font. An asset, not a font: it is loaded when the code editor
  # first opens, not on the IDE's first visit (D36).
  assets:
    - fonts/d2coding/D2Coding-Ver1.3.2-20180524.ttf
    # Pretendard Bold: loaded after the first frame (D30, BoldFont).
    - fonts/pretendard/Pretendard-Bold.otf
  # Pretendard 1.3.9 (OFL, fonts/pretendard/LICENSE.txt), the IDE's font
  # on every platform (D30, D49). The source is in README.md.
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/pretendard/Pretendard-Regular.otf
