name: gubasic_player_app
description: >-
  The player: runs one GuBASIC project as an app of its own, with the same
  interpreter and run window as the IDE's F5 (docs/DESIGN.md D79, D80).
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  gubasic_lang:
    path: ../../packages/gubasic_lang
  gubasic_player:
    path: ../../packages/gubasic_player
  gubasic_runtime:
    path: ../../packages/gubasic_runtime
  web: ^1.1.1

dev_dependencies:
  archive: ^4.5.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The project the player runs when no project.gbz is given (D83): for
  # `flutter run` while developing.
  assets:
    - project/
    - project/pictures/
  # Pretendard 1.3.9 (OFL, fonts/pretendard/LICENSE.txt), the IDE's font,
  # so that an app lays its text out as the IDE showed it (KNOWN_ISSUES).
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/pretendard/Pretendard-Regular.otf
