formatVersion: 1
properties:
  Caption: 성적표
  Width: 480
  Height: 340
controls:
  - name: grdScores
    type: Grid
    properties:
      Left: 16
      Top: 16
      Width: 448
      Height: 220
      Anchor: Left Top Right Bottom
  - name: lblTotal
    type: Label
    properties:
      Left: 16
      Top: 248
      Width: 448
      Anchor: Left Right Bottom
  - name: btnOpen
    type: Button
    properties:
      Caption: CSV 열기
      Left: 16
      Top: 288
      Width: 120
      Anchor: Left Bottom
  - name: btnPdf
    type: Button
    properties:
      Caption: PDF로 저장
      Left: 144
      Top: 288
      Width: 120
      Anchor: Left Bottom
  - name: lblStatus
    type: Label
    properties:
      Left: 280
      Top: 294
      Width: 184
      Anchor: Left Right Bottom
  - name: dlgOpen
    type: OpenFileDialog
    properties:
      Title: 명단 열기
      Filter: CSV 파일|*.csv
  - name: dlgSave
    type: SaveFileDialog
    properties:
      Title: 성적 저장
      Filter: PDF 파일|*.pdf
      FileName: 성적.pdf
