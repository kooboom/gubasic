name: gubasic_lang
description: Lexer, parser, interpreter and transpiler for the GuBASIC language. Pure Dart.
version: 0.6.0
publish_to: none

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
  sqlite3: 3.8.0
  test: ^1.25.0
dependencies:
  fixnum: ^1.1.1
  # The relay server's protocol without sockets (D136): the parity tests'
  # rooms run on it in memory.
  gubasic_relay:
    path: ../gubasic_relay
  source_span: ^1.10.2
  yaml: ^3.1.4
