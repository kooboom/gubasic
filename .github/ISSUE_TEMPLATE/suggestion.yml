name: 제안 / Suggestion
description: 있으면 좋을 기능이나 바꾸면 좋을 점을 알려 주세요. / An idea for a feature, or something to change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        먼저 [로드맵](https://github.com/kooboom/gubasic/blob/main/docs/ROADMAP.ko.md)과 [알려진 한계](https://github.com/kooboom/gubasic/blob/main/docs/KNOWN_ISSUES.ko.md)에 이미 있는지 봐 주세요. 개인 취미 프로젝트라 답이 늦을 수 있습니다.
        Please check the [roadmap](https://github.com/kooboom/gubasic/blob/main/docs/ROADMAP.md) and the [known issues](https://github.com/kooboom/gubasic/blob/main/docs/KNOWN_ISSUES.md) first. GuBASIC is a personal hobby project, so answers may be slow.
  - type: textarea
    id: problem
    attributes:
      label: 하고 싶은 일 / What you want to do
      description: 무엇을 만들려다 막혔는지, 무엇이 불편했는지. / What you were making, and where it got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 생각한 방법 / Your idea
      description: 코드나 화면으로 보여 주면 좋습니다. Visual Basic에서는 어떻게 했는지도 도움이 됩니다. / Code or a sketch helps, and how Visual Basic did it, if it did.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 다른 방법 / What you do instead now
  - type: dropdown
    id: who
    attributes:
      label: 어떤 쓰임인가요 / What is it for
      options:
        - 취미로 앱 만들기 / Making apps as a hobby
        - 업무 자동화 / Automating work
        - 수업이나 교육 / Teaching
        - 그 밖에 / Something else
