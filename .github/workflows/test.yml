name: test

on:
  push:
  pull_request:

# Every job uses the one Flutter version this repository is pinned to
# (packages/gubasic_runtime/pubspec.yaml, D29), and its Dart.
jobs:
  gubasic_lang:
    name: gubasic_lang (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gubasic_lang
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Check embedded components are up to date
        run: dart run tool/embed_components.dart --check
      - name: Test
        run: dart test

  playground:
    name: playground (format, analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Check embedded parity cases are up to date
        run: dart run tool/embed_parity.dart --check
      - name: Test (VM and Chrome)
        run: dart test -p vm,chrome
      - name: Build
        run: tool/build.sh

  gubasic_runtime:
    name: gubasic_runtime (format, analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gubasic_runtime
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Check the pinned Flutter version
        run: dart tool/check_flutter.dart
      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
          (cd tool/ime_probe && flutter pub get)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: |
          flutter analyze --fatal-infos
          (cd example && flutter analyze --fatal-infos)
          (cd tool/ime_probe && flutter analyze --fatal-infos)
      - name: Test
        run: flutter test
      - name: Build the example for the web
        run: flutter build web --release
        working-directory: packages/gubasic_runtime/example

  gubasic_player:
    name: gubasic_player (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gubasic_player
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Check the embedded benchmarks are up to date
        run: dart run tool/embed_bench.dart --check
      - name: Test (the parity scripts through the run window's widgets)
        run: flutter test

  player:
    name: player (format, analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build for the web
        run: flutter build web --release --no-web-resources-cdn
      - name: The player's size on the web (STAGE2_PLAN step 2-2)
        run: |
          du -sh build/web build/web/canvaskit
          ls -l build/web/main.dart.js
      - name: The web template (D84)
        run: |
          dart run tool/web_template.dart
          ls -l build/template.zip

  ide:
    name: ide (format, analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ide
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Check embedded examples are up to date
        run: dart run tool/embed_examples.dart --check
      - name: Test
        run: flutter test
      - name: Test in Chrome (projects kept in the browser, D33)
        run: flutter test --platform chrome test/web
      - name: Build for the web (engine and fonts served with the app, D30)
        run: flutter build web --release --no-web-resources-cdn
      - name: List the sizes for the loading percentage (D43)
        run: dart run tool/web_load_sizes.dart

  # The runtime's example and the IDE must keep building as desktop apps.
  windows:
    name: gubasic_runtime example (Windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/gubasic_runtime/example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - run: flutter build windows --release
      - run: flutter build windows --release
        working-directory: apps/ide
      - run: flutter build windows --release
        working-directory: packages/gubasic_runtime/tool/ime_probe
      - run: flutter build windows --release
        working-directory: apps/player
      # The IDE and the IME probe as folders that run on a Windows PC
      # without Flutter or Visual Studio: the Release folder with the
      # Visual C++ runtime next to the .exe ("application-local", as the
      # Flutter documentation describes). Downloaded from the run's
      # Artifacts on GitHub (docs/DESIGN.md D47).
      - name: Add the Visual C++ runtime to the Release folders
        working-directory: .
        shell: pwsh
        run: |
          foreach ($dir in 'apps/ide', 'packages/gubasic_runtime/tool/ime_probe', 'apps/player') {
            foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
              Copy-Item "$env:WINDIR/System32/$dll" "$dir/build/windows/x64/runner/Release"
            }
          }
      # askname clicked through inside the player on Windows: the window
      # takes each form's size (D88, D89).
      - name: Several forms in the player's own window
        working-directory: apps/player
        run: flutter test integration_test/forms_test.dart -d windows
      # A form's menus where the platform puts them (D106). Each file runs
      # on its own: a second app launched in one run loses its connection.
      - name: Menus in the player's own window
        working-directory: apps/player
        run: flutter test integration_test/menus_test.dart -d windows
      # The IDE's toolbox in its own window (D107): two columns of drawn
      # controls, the name in the tooltip; pictures of it in the Artifacts.
      - name: The toolbox in the IDE's own window
        working-directory: apps/ide
        run: flutter test integration_test/toolbox_test.dart -d windows --dart-define=SHOTS=${{ runner.temp }}/toolbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-windows
          path: ${{ runner.temp }}/toolbox/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: The Windows template (D86), with every file a PC needs
        working-directory: apps/player
        run: dart run tool/windows_template.dart
      # The IDE's own export, from that template, unzipped and opened as a
      # user would: it must start, take the project's name and the form's
      # size. The project is named 안녕 (U+C548 U+B155), for a program with
      # a Korean name.
      - name: Export hello as a Windows app, as the IDE does
        working-directory: apps/ide
        shell: pwsh
        run: |
          $env:GUBASIC_WINDOWS_TEMPLATE = "$PWD/../player/build/windows-template.zip"
          $env:GUBASIC_WINDOWS_APP = "$env:RUNNER_TEMP/hello-windows.zip"
          flutter test test/windows/export_hello_test.dart
      - name: Open the exported app and check its window
        working-directory: apps/player
        shell: pwsh
        run: |
          $name = [string][char]0xC548 + [char]0xB155
          ./tool/check_windows_app.ps1 -Zip "$env:RUNNER_TEMP/hello-windows.zip" -Name $name -Width 320 -Height 120 -Shot "$env:RUNNER_TEMP/exported-app.png"
          ./tool/check_windows_app.ps1 -Zip "$env:RUNNER_TEMP/hello-windows-end.zip" -Name Ending -Ends -AppId ciwindowsending1
          # Two forms (D88, D89): Swap's window takes Form2's size; Dialog
          # keeps Form1's, with Form2 over it.
          ./tool/check_windows_app.ps1 -Zip "$env:RUNNER_TEMP/hello-windows-swap.zip" -Name Swap -Width 360 -Height 220 -Shot "$env:RUNNER_TEMP/exported-swap.png"
          ./tool/check_windows_app.ps1 -Zip "$env:RUNNER_TEMP/hello-windows-dialog.zip" -Name Dialog -Width 320 -Height 200 -Shot "$env:RUNNER_TEMP/exported-dialog.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-windows-app
          path: ${{ runner.temp }}/exported-*.png
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: gubasic-ide-windows
          path: apps/ide/build/windows/x64/runner/Release
          retention-days: 30
          if-no-files-found: error
      - name: The player's size on Windows (STAGE2_PLAN step 2-2)
        working-directory: apps/player/build/windows/x64/runner/Release
        shell: pwsh
        run: |
          "{0:N1} MB" -f ((Get-ChildItem -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: gubasic-player-windows
          path: apps/player/build/windows/x64/runner/Release
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ime-probe-windows
          path: packages/gubasic_runtime/tool/ime_probe/build/windows/x64/runner/Release
          retention-days: 30
          if-no-files-found: error

  # macOS runners are slow and scarce: build on pull requests only.
  macos:
    name: gubasic_runtime example (macOS build)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/gubasic_runtime/example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - run: flutter build macos --release
      - run: flutter build macos --release
        working-directory: apps/ide
      - run: flutter build macos --release
        working-directory: apps/player
      - name: The player's size on macOS (STAGE2_PLAN step 2-2)
        run: du -sh "build/macos/Build/Products/Release/GuBASIC Player.app"
        working-directory: apps/player
      - name: Several forms in the player's own window
        working-directory: apps/player
        run: flutter test integration_test/forms_test.dart -d macos
      # A form's menus where the platform puts them (D106). Each file runs
      # on its own: a second app launched in one run loses its connection.
      - name: Menus in the player's own window
        working-directory: apps/player
        run: flutter test integration_test/menus_test.dart -d macos
      # The IDE's toolbox in its own window (D107): two columns of drawn
      # controls, the name in the tooltip; pictures of it in the Artifacts.
      - name: The toolbox in the IDE's own window
        working-directory: apps/ide
        run: flutter test integration_test/toolbox_test.dart -d macos --dart-define=SHOTS=${{ runner.temp }}/toolbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-macos
          path: ${{ runner.temp }}/toolbox/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: The macOS template (D87), with every file the app needs
        run: dart run tool/macos_template.dart
        working-directory: apps/player
      # The IDE's own export, from that template, unzipped and checked as a
      # Mac would: signature, Gatekeeper, running and ending (D87).
      - name: Export hello and Ending as macOS apps, as the IDE does
        working-directory: apps/ide
        run: |
          mkdir -p "$RUNNER_TEMP/macapps"
          GUBASIC_MACOS_TEMPLATE="$PWD/../player/build/macos-template.zip" \
          GUBASIC_MACOS_APPS="$RUNNER_TEMP/macapps" \
          flutter test test/macos/export_hello_test.dart
      - name: Check the exported macOS apps
        working-directory: apps/player
        run: tool/check_macos_app.sh "$RUNNER_TEMP/macapps"
