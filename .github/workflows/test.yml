name: test

on:
  push:
  pull_request:

jobs:
  gubasic_lang:
    name: gubasic_lang (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gubasic_lang
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test

  playground:
    name: playground (format, analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test (VM and Chrome)
        run: dart test -p vm,chrome
      - name: Build
        run: tool/build.sh
