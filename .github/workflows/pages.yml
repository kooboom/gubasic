name: pages

# Builds the playground and the web IDE and publishes them to GitHub Pages
# whenever main changes: the playground at https://kooboom.github.io/gubasic/
# and the IDE at https://kooboom.github.io/gubasic/ide/, one artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: dart pub get
        working-directory: apps/playground
      - name: Build the playground
        run: tool/build.sh
        working-directory: apps/playground
      - name: Build the IDE
        # The engine and fonts come from this site, not from a CDN (D30).
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href /gubasic/ide/
          dart run tool/web_load_sizes.dart
          cp -R build/web ../playground/build/web/ide
        working-directory: apps/ide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/playground/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
