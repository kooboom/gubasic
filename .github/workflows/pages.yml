name: pages

# Builds the playground and publishes it to GitHub Pages
# (https://kooboom.github.io/gubasic) whenever main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: dart pub get
        working-directory: apps/playground
      - name: Build
        run: tool/build.sh
        working-directory: apps/playground
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/playground/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
