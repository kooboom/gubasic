name: pages

# Builds the playground and the web IDE and publishes them to GitHub Pages
# whenever main changes: the playground at https://kooboom.github.io/gubasic/,
# the IDE at https://kooboom.github.io/gubasic/ide/ and the players'
# templates, which the IDE's File → Export as Web App and Export as Windows
# App take (D84, D86), at https://kooboom.github.io/gubasic/player/
# template.zip and windows-template.zip; one artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The Windows player is built on Windows, then joins the site.
  windows-template:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - run: flutter build windows --release
      # The Visual C++ runtime next to the program, as in test.yml (D47).
      - name: Add the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" build/windows/x64/runner/Release
          }
      - run: dart run tool/windows_template.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows-template
          path: apps/player/build/windows-template.zip
          retention-days: 1
          if-no-files-found: error

  build:
    needs: windows-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/gubasic_runtime/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: dart pub get
        working-directory: apps/playground
      - name: Build the playground
        run: tool/build.sh
        working-directory: apps/playground
      - name: Build the IDE
        # The engine and fonts come from this site, not from a CDN (D30).
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href /gubasic/ide/
          dart run tool/web_load_sizes.dart
          cp -R build/web ../playground/build/web/ide
        working-directory: apps/ide
      - name: Build the web player's template
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn
          dart run tool/web_template.dart
          mkdir -p ../playground/build/web/player
          cp build/template.zip ../playground/build/web/player/
        working-directory: apps/player
      - uses: actions/download-artifact@v4
        with:
          name: windows-template
          path: apps/playground/build/web/player
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/playground/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
