<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The default icon of an exported app: a form window with a button, and the pointer clicking it.
       macOS: shrunk to an 824 px body with a 100 px margin and a shadow, as other macOS app icons (D85). -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10.87" stdDeviation="5.44" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C80B8"/>
      <stop offset="1" stop-color="#2F5C8F"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.919643) translate(-512 -512)">
    <rect x="64" y="64" width="896" height="896" rx="201.6" fill="url(#bg)" filter="url(#shadow)"/>
    <rect x="200" y="230" width="624" height="520" rx="44" fill="#FFFFFF"/>
    <path d="M200 274a44 44 0 0 1 44-44h536a44 44 0 0 1 44 44v66H200z" fill="#DDE6F1"/>
    <rect x="250" y="270" width="190" height="30" rx="15" fill="#A9BCD3"/>
    <rect x="270" y="420" width="300" height="110" rx="22" fill="#3B6EA5"/>
    <rect x="270" y="580" width="420" height="34" rx="17" fill="#C9D6E6"/>
    <path d="M600 470 L600 790 L668 724 L716 830 L768 806 L720 702 L812 702 Z" fill="#1E2A38" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
