# Keeps a program's data in an SQLite database file (docs/DESIGN.md D124,
# D126), the way Visual Basic 6 kept it in a Jet database through Data
# Access Objects
# (https://learn.microsoft.com/en-us/previous-versions/visualstudio/visual-basic-6/aa227845(v=vs.60)).
# A built-in object used by its name, not put on a form. Every app has a
# database of its own, data.db in the app's own data folder, opened when
# first used; Database.Open(name) opens another file there instead.
# Execute(sql, values…) runs a statement and gives how many rows it
# changed; Query(sql, values…) gives the rows as a Table; Scalar(sql,
# values…) gives the first value of the first row as text, "" for NULL or
# no row, and LastWasNull says which. A value goes into the SQL as a ?,
# and after it in the call: Database.Execute("INSERT INTO scores(name,
# points) VALUES (?, ?)", txtName.Text, points); a quote in the value
# then cannot break the statement. Integer, Double and String go in as
# they are, Boolean as 1 or 0, Date as "yyyy-MM-dd HH:mm:ss", Nothing as
# NULL. LastId is the row ID the last INSERT gave; Path is where the file
# is; Close() closes it (the next use opens it again). Export(path) writes
# the database as a file, a backup, where File writes files (on the web,
# a download); Import(path) replaces the database with such a file, one
# chosen with OpenFileDialog or exported in this run on the web. SQL the
# database cannot run is R042; a name that is not a file name is R043; a
# database that cannot be opened is R044; a file that is not an SQLite
# database is R045. SQL joined with & is a warning (A060).
name: Database
version: 1
object: true
platforms: [web, macos, windows]
properties:
  # Where the open database file is: on the desktop its full path, on the
  # web its name in the browser's storage.
  - { name: Path, type: String, default: "", readOnly: true }
  # Whether the last Scalar found NULL, or no row at all.
  - { name: LastWasNull, type: Boolean, default: false, readOnly: true }
  # The row ID of the last INSERT (SQLite's last_insert_rowid).
  - { name: LastId, type: Integer, default: 0, readOnly: true }
events: []
methods:
  - Open(name As String)
  - Execute(sql As String, ParamArray values As Value) As Integer
  - Query(sql As String, ParamArray values As Value) As Table
  - Scalar(sql As String, ParamArray values As Value) As String
  - Close()
  - Export(path As String)
  - Import(path As String)
# Names other versions of BASIC use, pointed to GuBASIC's (A036,
# docs/DESIGN.md D50): Data Access Objects' and ADO's.
otherNames:
  OpenDatabase: Open
  OpenRecordset: Query
  ExecuteNonQuery: Execute
  ExecuteScalar: Scalar
