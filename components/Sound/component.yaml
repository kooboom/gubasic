# Plays the project's sounds (docs/DESIGN.md D138): the files in its
# sounds/ folder, WAV or MP3, listed in the .gbproj. A built-in object
# used by its name, not put on a form. Sound.Play(name) plays an effect
# at once and goes on without waiting, several overlapping; a Play while
# the same sound plays starts it again over it. Sound.PlayMusic(name)
# plays a sound round and round until Sound.StopMusic(), the program ends,
# or another PlayMusic replaces it, one at a time. Volume, from 0 to 100,
# is for everything the program plays. A name the project has no sound
# of is R053. On the web a page may play sound only after the user has
# clicked or pressed a key on it, so a Play before that is dropped
# without an error. Through the component channel, as Http is.
name: Sound
version: 1
object: true
platforms: [web, macos, windows]
properties:
  # For everything the program plays, from 0 (silent) to 100.
  - { name: Volume, type: Integer, min: 0, max: 100, default: 100 }
events: []
methods:
  - Play(name As String)
  - PlayMusic(name As String)
  - StopMusic()
# Names other versions of BASIC use, pointed to GuBASIC's (A036,
# docs/DESIGN.md D50): Visual Basic .NET's My.Computer.Audio.
otherNames:
  Stop: StopMusic
