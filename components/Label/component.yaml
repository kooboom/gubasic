name: Label
version: 1
visual: true
# Drawn under Buttons and TextBoxes, whatever the order (DESIGN.md D41).
layer: graphic
defaultEvent: Click
properties:
  - { name: Caption, type: String, default: "" }
  - { name: Left, type: Integer, default: 0 }
  - { name: Top, type: Integer, default: 0 }
  - { name: Width, type: Integer, min: 0, default: 120 }
  - { name: Height, type: Integer, min: 0, default: 24 }
events:
  - Click()
methods: []
# Names other versions of BASIC use, pointed to GuBASIC's (A036,
# docs/DESIGN.md D50).
otherNames:
  Text: Caption
