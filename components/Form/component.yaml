# The form a program's controls sit on (docs/DESIGN.md §5).
# Width and Height are the size of the area inside the window. Resize runs
# when it changes, and once when the form is first shown (D58).
# Integer properties are 32-bit (min and max narrow that); a value outside
# is a run-time error (R007) or, in a form file, F012.
name: Form
version: 1
visual: true
defaultEvent: Load
properties:
  - { name: Caption, type: String, default: "" }
  - { name: Width, type: Integer, min: 0, default: 480, changeEvent: Resize }
  - { name: Height, type: Integer, min: 0, default: 360, changeEvent: Resize }
events:
  - Load()
  - Resize()
methods: []
# Names other versions of BASIC use, pointed to GuBASIC's (A036,
# docs/DESIGN.md D50).
otherNames:
  Text: Caption
