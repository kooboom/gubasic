# The form a program's controls sit on (docs/DESIGN.md §5).
# Width and Height are the size of the area inside the window.
# Integer properties are 32-bit (min and max narrow that); a value outside
# is a run-time error (R007) or, in a form file, F012.
name: Form
version: 1
visual: true
defaultEvent: Load
properties:
  - { name: Caption, type: String, default: "" }
  - { name: Width, type: Integer, min: 0, default: 480 }
  - { name: Height, type: Integer, min: 0, default: 360 }
events:
  - Load()
methods: []
